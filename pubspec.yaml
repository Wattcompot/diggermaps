name: digger_maps
description: "DiggerMaps — навигатор для копателей"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  flutter_compass: ^0.8.1
  firebase_auth: ^5.7.0
  shared_preferences: ^2.3.0
  hive_flutter: ^1.1.0
  dio: ^5.8.0
  http: ^1.2.2
  crypto: ^3.0.6
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  saf: ^1.0.3
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  xml: ^6.5.0
  archive: ^4.0.7
  file_picker: ^11.0.2
  image_picker: ^1.2.0
  record: ^6.1.2
  audioplayers: ^6.5.1
  video_player: ^2.11.1
  url_launcher: ^6.3.1
  intl: ^0.19.0
  flutter_map_mbtiles: ^1.0.4
  mbtiles: ^0.4.2
  flutter_map_location_marker: ^10.0.0
  flutter_map_tile_caching: ^10.1.0
  photo_manager: ^3.12.0

